name: Radar Update and Publish
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect repository snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update.py
      - name: Generate weekly issue on Monday
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDERS_JSON: ${{ secrets.AI_PROVIDERS_JSON }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then python scripts/weekly.py; fi
      - name: Incremental Chinese descriptions (daily budget)
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDERS_JSON: ${{ secrets.AI_PROVIDERS_JSON }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          ZH_DAILY_LIMIT: '25'
        run: python scripts/translate.py
      - run: python scripts/build.py
      - name: Build Chinese project details
        run: python scripts/details.py
      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m 'chore: refresh radar data'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Automatic rebase conflicted; aborting without overwriting remote changes."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Data changes pushed successfully"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Push failed after 5 synchronization attempts"
                exit 1
              fi
              sleep $((attempt * 3))
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
