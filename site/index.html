<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开源雷达 · OpenSource Radar</title><style>body{margin:0;background:#0b1220;color:#e8eefb;font:16px system-ui,-apple-system,sans-serif}main{max-width:1040px;margin:auto;padding:32px 18px}h1{font-size:2.3rem}p,small{color:#a6b4c9}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}input,select{background:#18243a;color:white;border:1px solid #334563;border-radius:9px;padding:12px;font:inherit}input{flex:1;min-width:200px}.item{border:1px solid #293951;background:#121e31;padding:20px;margin:12px 0;border-radius:14px}a{color:#79bbff;text-decoration:none}a:hover{text-decoration:underline}.meta{display:flex;gap:18px;flex-wrap:wrap;color:#a6b4c9;font-size:14px}.tag{color:#9cdbb7}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}button{padding:10px;background:#24395a;color:white;border:0;border-radius:8px;cursor:pointer}.weekly-feature{border:1px solid #3974a9;background:linear-gradient(120deg,#142f4b,#15233a);padding:22px;border-radius:15px;margin:24px 0}.weekly-feature h2{margin:0 0 8px}.weekly-feature p{margin:8px 0 14px}.weekly-link{display:inline-block;background:#67b7ff;color:#081523;font-weight:700;padding:11px 17px;border-radius:9px}.topnav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.weekly-history{scroll-margin-top:24px}</style></head><body><main><div class="top"><h1>🔭 开源雷达</h1><nav class="topnav"><a href="#ranking">项目排行榜</a><a href="#weekly-history">中文周刊</a><a href="https://github.com/edcv593/opensource-radar">GitHub ↗</a></nav></div><p>自动发现热门开源项目 · Star 快照统计 · 中文精选周刊</p><section class="weekly-feature" aria-label="最新中文周刊"><h2>📖 最新中文开源周刊</h2><p id="weekly-summary">每周精选热门开源项目，附 AI 生成的中文介绍。</p><a class="weekly-link" id="latest-weekly" href="./weekly/2026-10-23.html">阅读最新中文周刊 →</a></section><h2 id="ranking">🔥 开源项目排行榜</h2><div class="toolbar"><input id="search" placeholder="搜索中文介绍、项目名称、分类或语言"><select id="category"><option value="">全部中文分类</option></select><select id="topic"><option value="">全部 GitHub 标签</option></select><select id="lang"><option value="">全部语言</option></select><select id="sort"><option value="growth">7日增长</option><option value="trend">趋势精选</option><option value="month">30日增长</option><option value="stars">总 Star</option></select></div><p id="status">正在加载数据…</p><section id="items"></section><h2 class="weekly-history" id="weekly-history">📚 历史周刊</h2><section id="weekly"></section></main><script>
let repos=[];const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('search').value.toLowerCase(),lang=$('lang').value,cat=$('category').value,topic=$('topic').value;let rows=repos.filter(x=>(x.full_name+' '+x.description+' '+(x.description_zh||'')+' '+(x.category||'')+' '+x.language).toLowerCase().includes(q)&&(!lang||x.language===lang)&&(!cat||x.category===cat)&&(!topic||(x.topics||[]).includes(topic)));rows.sort((a,b)=>$('sort').value==='trend'?(b.trend_score??-1)-(a.trend_score??-1):$('sort').value==='stars'?b.stars-a.stars:$('sort').value==='month'?(b.month_growth??-1)-(a.month_growth??-1):(b.week_growth??-1)-(a.week_growth??-1));$('items').innerHTML=rows.slice(0,100).map((x,i)=>`<article class="item"><h3>${i+1}. <a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.full_name)}</a></h3><p>${esc(x.description_zh||x.description||'暂无描述')}</p><div class="meta"><span>⭐ ${Number(x.stars).toLocaleString()}</span><span class="tag">7日增长：${x.week_growth==null?'积累中':'+'+x.week_growth}</span><span>30日增长：${x.month_growth==null?'积累中':'+'+x.month_growth}</span><span>${esc(x.language)}</span><span class="tag">${esc(x.category||'其他')}</span><span>${esc((x.topics||[]).slice(0,3).join(' · '))}</span></div></article>`).join('')||'<p>没有匹配结果</p>'}async function init(){try{let [r,w]=await Promise.all([fetch('./data/ranking.json'),fetch('./data/weekly-index.json')]);if(!r.ok)throw Error('ranking missing');let d=await r.json();repos=d.items;$('status').textContent=`更新于 ${d.updated_at} · 共采集 ${d.total_candidates??repos.length} 个候选项目 · 展示 ${repos.length} 条 · 数据源成功 ${d.successful_sources??"—"} 组 · 7日增长需积累历史快照`;let langs=[...new Set(repos.map(x=>x.language))].sort();$('lang').innerHTML+=[...langs].map(x=>`<option>${esc(x)}</option>`).join('');let cats=[...new Set(repos.map(x=>x.category||'其他'))].sort();$('category').innerHTML+=cats.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');let topics=[...new Set(repos.flatMap(x=>x.topics||[]))].sort();$('topic').innerHTML+=topics.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(w.ok){let a=await w.json();if(a.length){$('latest-weekly').href='./weekly/'+encodeURIComponent(a[0])+'.html';$('latest-weekly').textContent='阅读 '+a[0]+' 中文周刊 →';$('weekly-summary').textContent='最新一期：'+a[0]+' · AI 中文项目介绍';}$('weekly').innerHTML=a.map(x=>`<p><a href="./weekly/${encodeURIComponent(x)}.html">${esc(x)} 中文周刊 →</a></p>`).join('')||'<p>暂无历史周刊</p>'}else{$('weekly').innerHTML='<p>周刊索引尚未发布，可先点击上方最新周刊入口。</p>'}render()}catch(e){$('status').textContent='暂时无法加载数据，请稍后重试：'+e.message}}['search','lang','category','topic','sort'].forEach(x=>$(x).addEventListener(x==='search'?'input':'change',render));init();</script></body></html>
