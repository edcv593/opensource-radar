<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开源雷达 · OpenSource Radar</title><style>body{margin:0;background:#0b1220;color:#e8eefb;font:16px system-ui,-apple-system,sans-serif}main{max-width:1040px;margin:auto;padding:32px 18px}h1{font-size:2.3rem}p,small{color:#a6b4c9}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}input,select{background:#18243a;color:white;border:1px solid #334563;border-radius:9px;padding:12px;font:inherit}input{flex:1;min-width:200px}.item{border:1px solid #293951;background:#121e31;padding:20px;margin:12px 0;border-radius:14px}a{color:#79bbff;text-decoration:none}a:hover{text-decoration:underline}.meta{display:flex;gap:18px;flex-wrap:wrap;color:#a6b4c9;font-size:14px}.tag{color:#9cdbb7}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}button{padding:10px;background:#24395a;color:white;border:0;border-radius:8px;cursor:pointer}.topnav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.weekly-history{scroll-margin-top:24px}</style></head><body><main><div class="top"><h1>🔭 开源雷达</h1><nav class="topnav"><a href="#ranking">项目排行榜</a><a href="#weekly-history">中文周刊</a><a href="https://github.com/edcv593/opensource-radar">GitHub ↗</a></nav></div><p>自动发现热门开源项目 · Star 快照统计 · 中文精选周刊</p><h2 id="ranking">🔥 开源项目排行榜</h2><div class="toolbar"><input id="search" placeholder="搜索中文介绍、项目名称、分类或语言"><select id="category"><option value="">全部中文分类</option></select><select id="topic"><option value="">全部 GitHub 标签</option></select><select id="lang"><option value="">全部语言</option></select><select id="sort"><option value="day">24小时增长</option><option value="growth">7日增长</option><option value="trend">趋势精选</option><option value="month">30日增长</option><option value="stars">总 Star</option></select></div><p id="status">正在加载数据…</p><section id="items"></section><h2 class="weekly-history" id="weekly-history">📚 历史周刊</h2><section id="weekly"></section></main><script>
const synonyms={'nas':['nas','self-hosted','homelab','home-server','自托管'],'影视':['media','movie','video','jellyfin','plex','emby','影视'],'照片':['photo','immich','gallery','相册'],'下载':['download','aria2','torrent','下载'],'ai编程':['ai','coding','code','copilot','agent','编程'],'人工智能':['ai','llm','machine-learning','大模型'],'自动化':['automation','workflow','n8n'],'数据库':['database','postgresql','mysql'],'隐私':['privacy','security'],'容器':['docker','kubernetes','container']};function terms(q){let a=[q];for(let [k,v] of Object.entries(synonyms)){if(q.includes(k))a.push(...v)}return a}let repos=[];const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let q=$('search').value.toLowerCase(),lang=$('lang').value,cat=$('category').value,topic=$('topic').value;let rows=repos.filter(x=>terms(q).some(term=>(x.full_name+' '+x.description+' '+(x.description_zh||'')+' '+(x.category||'')+' '+x.language+' '+(x.topics||[]).join(' ')).toLowerCase().includes(term))&&(!lang||x.language===lang)&&(!cat||x.category===cat)&&(!topic||(x.topics||[]).includes(topic)));rows.sort((a,b)=>$('sort').value==='day'?(b.day_growth??-1)-(a.day_growth??-1)||b.stars-a.stars:$('sort').value==='trend'?(b.trend_score??-1)-(a.trend_score??-1):$('sort').value==='stars'?b.stars-a.stars:$('sort').value==='month'?(b.month_growth??-1)-(a.month_growth??-1):(b.week_growth??-1)-(a.week_growth??-1));$('items').innerHTML=rows.slice(0,100).map((x,i)=>`<article class="item"><h3>${i+1}. <a href="./projects/${encodeURIComponent(x.full_name.split('/')[0])}/${encodeURIComponent(x.full_name.split('/')[1])}/">${esc(x.full_name)}</a></h3><p>${esc(x.description_zh||x.description||'暂无描述')}</p><div class="meta"><span>⭐ ${Number(x.stars).toLocaleString()}</span><span class="tag">24小时增长：${x.day_growth==null?'积累中':'+'+x.day_growth}</span><span class="tag">7日增长：${x.week_growth==null?'积累中':'+'+x.week_growth}</span><span>30日增长：${x.month_growth==null?'积累中':'+'+x.month_growth}</span><span>${esc(x.language)}</span><span class="tag">${esc(x.category||'其他')}</span><span>${esc((x.topics||[]).slice(0,3).join(' · '))}</span></div><p><a href="./projects/${encodeURIComponent(x.full_name.split('/')[0])}/${encodeURIComponent(x.full_name.split('/')[1])}/">查看中文详情 →</a> · <a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">GitHub ↗</a></p></article>`).join('')||'<p>没有匹配结果</p>'}async function init(){try{let [r,w]=await Promise.all([fetch('./data/ranking.json'),fetch('./data/weekly-index.json')]);if(!r.ok)throw Error('ranking missing');let d=await r.json();repos=d.items;const sort=$('sort');const dayReady=repos.some(x=>x.day_growth!=null),weekReady=repos.some(x=>x.week_growth!=null),monthReady=repos.some(x=>x.month_growth!=null);sort.querySelector('[value="day"]').disabled=!dayReady;sort.querySelector('[value="growth"]').disabled=!weekReady;sort.querySelector('[value="month"]').disabled=!monthReady;sort.querySelector('[value="trend"]').disabled=!weekReady;sort.value=dayReady?'day':'stars';$('status').textContent=`更新于 ${d.updated_at} · 共采集 ${d.total_candidates??repos.length} 个候选项目 · 展示 ${repos.length} 条 · 数据源成功 ${d.successful_sources??"—"} 组 · 中文介绍 ${d.zh_coverage??repos.filter(x=>x.description_zh).length}/${d.zh_total??repos.length} · 当前排序：${sort.options[sort.selectedIndex].text} · ${!weekReady?'7日增长积累中 · ':''}${!monthReady?'30日增长积累中':''}`;let langs=[...new Set(repos.map(x=>x.language))].sort();$('lang').innerHTML+=[...langs].map(x=>`<option>${esc(x)}</option>`).join('');let cats=[...new Set(repos.map(x=>x.category||'其他'))].sort();$('category').innerHTML+=cats.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');let topics=[...new Set(repos.flatMap(x=>x.topics||[]))].sort();$('topic').innerHTML+=topics.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(w.ok){let a=await w.json();$('weekly').innerHTML=a.map(x=>`<p><a href="./weekly/${encodeURIComponent(x)}.html">${esc(x)} 中文周刊 →</a></p>`).join('')||'<p>暂无历史周刊</p>'}else{$('weekly').innerHTML='<p>暂无历史周刊</p>'}render()}catch(e){$('status').textContent='暂时无法加载数据，请稍后重试：'+e.message}}['search','lang','category','topic','sort'].forEach(x=>$(x).addEventListener(x==='search'?'input':'change',render));init();</script></body></html>
